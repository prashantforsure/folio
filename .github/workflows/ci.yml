name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Playwright is a separate step on purpose: AGENTS.md lists `test:e2e` as
      # a scoped run, not part of `pnpm test`, so `pnpm test` stays runnable
      # without browsers installed.
      - run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm test:e2e
